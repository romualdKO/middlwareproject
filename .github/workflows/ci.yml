name: CI

on:
  push:
    branches: [main, romuald-pharmacie-radiologie]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m grpc_services.generate_proto
      - run: python tests/test_pharmacie_rpc.py
      - run: python tests/test_radiologie_rpc.py
      - run: python tests/test_delais_rpc.py
      - run: python tests/test_medecin_integration.py
      - run: python tests/test_api_gateway.py
      - run: python -m pytest -q tests
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example build
