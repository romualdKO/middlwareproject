syntax = "proto3";

package clinique.radiologie;

service RadiologieService {
  rpc ObtenirExamen (ObtenirExamenRequest) returns (ObtenirExamenResponse);
  rpc MettreAJourEtatExamen (MettreAJourEtatExamenRequest) returns (MettreAJourEtatExamenResponse);
}

message MettreAJourEtatExamenRequest {
  string examen_id = 1;
  string etat = 2;
  string resultat = 3;
}

message MettreAJourEtatExamenResponse {
  Examen examen = 1;
  bool notification_envoyee = 2;
  string message = 3;
}

message ObtenirExamenRequest {
  string examen_id = 1;
  string patient_id = 2;
}

message ObtenirExamenResponse {
  string examen_id = 1;
  string type_examen = 2;
  string etat = 3;
  string resultat = 4;
  string message = 5;
  string patient_id = 6;
  repeated Examen examens = 7;
}

message Examen {
  string examen_id = 1;
  string patient_id = 2;
  string type_examen = 3;
  string etat = 4;
  string resultat = 5;
  string date = 6;
}
